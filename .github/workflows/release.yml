name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize the complete publish + prune transaction across version tags.
concurrency:
  group: macrdp-fork-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'

jobs:
  build:
    name: Verify, build, publish and retain current release
    if: github.repository == 'zhangyxXyz/macrdp' && github.event.deleted == false
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tag belongs to dev
        run: git merge-base --is-ancestor HEAD origin/dev
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Reuse package dependency cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: packaged-apps
          key: fork-packaging-check
      - name: Regression gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --release --locked
          cargo build --release --locked
          python3 scripts/check-config-cli.py target/release/macrdp
          swift run --package-path gui --scratch-path gui/.build ConfigSupportTests
          python3 -m unittest discover -s scripts/tests
          python3 scripts/check-file-provider.py --build-root "$RUNNER_TEMP/file-provider-checks"
      - name: Build and verify both apps
        env:
          CODESIGN_IDENTITY: '-'
        run: |
          cargo build --release --locked --manifest-path ifd-handler/Cargo.toml
          swift build --package-path gui -c release --product macrdphud
          swift build --package-path gui -c release --product macrdpshield
          SKIP_BUILD=1 APP_DIR="$RUNNER_TEMP/appout" packaging/make-app.sh
          APP_DIR="$RUNNER_TEMP/appout" gui/make-tray-app.sh
          codesign --verify --deep --strict target/macrdp.app
          codesign --verify --deep --strict target/macrdpController.app
      - name: Package apps, provenance and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p target/app-pair dist
          cp -R target/macrdp.app target/macrdpController.app target/app-pair/
          cp README.md README_CN.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE target/app-pair/
          git rev-parse HEAD > target/app-pair/SOURCE_COMMIT
          target/release/macrdp --capabilities > target/app-pair/CAPABILITIES.json
          NAME="macrdp-${RELEASE_TAG}-aarch64-apple-darwin-app.zip"
          ditto -c -k target/app-pair "dist/${NAME}"
          (cd dist && shasum -a 256 "$NAME" > SHA256SUMS)
      - name: Stage assets in draft, download, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/fork_release.py stage
      - name: Retain current verified fork release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fork_release.py cleanup
