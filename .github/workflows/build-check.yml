name: build-check

# Optional manual package check. dev pushes run CI; a version tag builds
# the distributable exactly once in release.yml. No artifact/draft uploads here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  RUST_BACKTRACE: '1'

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  packaged-apps:
    name: build and verify app bundles
    needs: checks
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: '1.95.0'
          target: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: packaged-apps
          key: native-and-arm64
      - name: Build ARM64 apps and verify components
        env:
          CODESIGN_IDENTITY: '-'
          MACRDP_TARGET: aarch64-apple-darwin
        run: |
          APP_DIR="$RUNNER_TEMP/appout" packaging/make-app.sh
          APP_DIR="$RUNNER_TEMP/appout" gui/make-tray-app.sh
          python3 scripts/check-app-bundles.py --app-root target --source-sha "$GITHUB_SHA"
      - name: Record verified source
        run: |
          echo "Verified build from $(git rev-parse HEAD). No release, artifact upload or local installation." >> "$GITHUB_STEP_SUMMARY"
