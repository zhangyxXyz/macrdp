name: build-check

# Optional manual package check. dev pushes run CI; a version tag builds
# the distributable exactly once in release.yml. No artifact/draft uploads here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'

jobs:
  packaged-apps:
    name: Verify release-mode app bundles (no publish)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          key: fork-packaging-check
      - name: Verify and build
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --release --locked
          cargo build --release --locked
          python3 scripts/check-config-cli.py target/release/macrdp
          swift run --package-path gui --scratch-path gui/.build ConfigSupportTests
          python3 -m unittest discover -s scripts/tests
      - name: Package outside Applications and verify signatures
        env:
          CODESIGN_IDENTITY: '-'
        run: |
          cargo build --release --locked --manifest-path ifd-handler/Cargo.toml
          swift build --package-path gui -c release --product macrdphud
          swift build --package-path gui -c release --product macrdpshield
          SKIP_BUILD=1 APP_DIR="$RUNNER_TEMP/appout" packaging/make-app.sh
          APP_DIR="$RUNNER_TEMP/appout" gui/make-tray-app.sh
          codesign --verify --deep --strict target/macrdp.app
          codesign --verify --deep --strict target/macrdpController.app
      - name: Record verified source
        run: |
          echo "Verified build from $(git rev-parse HEAD). No release, artifact upload or local installation." >> "$GITHUB_STEP_SUMMARY"
