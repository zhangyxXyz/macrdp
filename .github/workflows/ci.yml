name: ci

# Shared regression gate for changes and manual package checks. Release packaging
# is independent; maintainers run regressions before tagging. Linux covers
# platform-independent code; macOS covers native paths.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A called workflow inherits its caller's github.workflow. Keep the checks
  # separate from the caller's concurrency group and from standalone dev CI.
  group: ci-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  RUST_BACKTRACE: '1'

jobs:
  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Shared by direct CI runs and release/package callers.
      - name: Format check
        run: cargo fmt --all -- --check

      # The platform-independent tests (pure logic + the non-macOS stub trait
      # tests) run here. RUSTFLAGS is cleared because the macOS stubs leave some
      # macOS-only items unused on Linux by design — same rationale as the
      # macOS-only lint gate below.
      - name: Test (Linux stubs)
        env:
          RUSTFLAGS: ''
        run: |
          cargo test --locked
          # Dependency unit tests require explicit selection. Exercise late
          # legacy frame acknowledgements across desktop reactivation.
          cargo test --locked -p ironrdp-acceptor --lib

      # Root tests do not run dependencies' own unit tests. Exercise the RSA
      # adapters with root-seeded locks and reject production crypto drift.
      - name: Test auth dependencies (RSA adapters)
        env:
          RUSTFLAGS: ''
        run: bash scripts/test-auth-dependencies.sh

      # vendor/macrdp-rdpeudp is a STANDALONE crate (not a workspace member, so
      # the root cargo test/fmt don't reach it). It's platform-independent
      # (sans-I/O wire codecs + reliability state machine), so test + fmt-check
      # it here. It resolves ironrdp-core via its own [patch.crates-io].
      - name: Test macrdp-rdpeudp (standalone crate)
        env:
          RUSTFLAGS: ''
        run: |
          cargo fmt --manifest-path vendor/macrdp-rdpeudp/Cargo.toml -- --check
          cargo test --manifest-path vendor/macrdp-rdpeudp/Cargo.toml

      # vendor/ironrdp-server is a [patch.crates-io] path crate, not a workspace
      # member, and its manifest sets `[lib] test = false`, so the root
      # `cargo test` never runs its unit tests (the divergence tests, e.g. the
      # surface command per codec of divergence (34)). `--lib` runs them; the
      # crate resolves its IronRDP siblings via its own [patch.crates-io].
      # Platform-independent, so Linux is enough. `egfx` as macrdp builds it;
      # `multitransport` (BoringSSL from source) is left out to keep the job
      # fast. No --locked: vendor/*/Cargo.lock is not committed (as for rdpeudp).
      - name: Test ironrdp-server (vendored crate, unit tests)
        env:
          RUSTFLAGS: ''
        run: cargo test --manifest-path vendor/ironrdp-server/Cargo.toml --lib --features egfx

  test-macos:
    name: test (macos)
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    # Share one hosted Mac between pure tests, configuration and audit gates.
    # The old three-job fan-out required three separate ARM64 allocations.
    timeout-minutes: 60
    steps:
      # Bound monitoring startup separately so a stalled agent fails before
      # consuming the time reserved for builds and tests.
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # ARM64 is preferred; an Intel override runs native host regressions and
      # separately checks the ARM64 target. The package is always ARM64.
      - name: Verify supported macOS runner
        run: |
          case "$(uname -m)" in
            arm64|x86_64) ;;
            *) echo "::error::Unsupported macOS runner architecture"; exit 1 ;;
          esac

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: '1.95.0'
          target: aarch64-apple-darwin
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: packaged-apps
          key: native-and-arm64

      # Full suite including the macOS-gated pure-logic tests (resolve_dest,
      # keyboard-layout parsing, h264 NAL conversion, aac, etc.). These are
      # pure-logic and headless — they do NOT require Screen Recording /
      # Accessibility TCC grants (the capture/input/audio loops aren't unit
      # tested). RUSTFLAGS keeps the default (-D warnings) so a warning in test
      # code fails here too. Release-mode tests also cover the package profile;
      # the separate debug binary below remains available to the audit script.
      - name: Clippy (all macOS targets, warnings as errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check ARM64 target on Intel fallback
        if: runner.arch == 'X64'
        run: cargo clippy --locked --target aarch64-apple-darwin --all-targets -- -D warnings

      - name: Test (macOS — full code paths)
        env:
          RUSTFLAGS: '-D warnings'
        run: |
          cargo test --release --locked
          python3 scripts/check-audio-tap.py --build-root "$RUNNER_TEMP/audio-tap-checks"
          python3 scripts/check-file-provider.py --build-root "$RUNNER_TEMP/file-provider-checks"

      # Build once for both process-level configuration checks and the audit
      # integration script, which looks for target/debug/macrdp. This also reuses
      # the native debug dependencies checked by Clippy above.
      - name: Build macrdp for configuration and audit checks
        run: cargo build --locked

      - name: Configuration CLI checks
        run: python3 scripts/check-config-cli.py target/debug/macrdp

      - name: Controller configuration tests
        run: swift run --package-path gui --scratch-path gui/.build ConfigSupportTests

      - name: Workflow maintenance tests
        run: python3 -m unittest discover -s scripts/tests

      # End-to-end AUDIT LOG coverage still uses a real loopback server and
      # FreeRDP +auth-only: cargo's TLS-only harness cannot drive CredSSP/NLA.
      # Reuse this runner and native build instead of allocating another Mac.
      - name: Install FreeRDP
        run: brew install freerdp

      # The script starts macrdp on loopback (--skip-auth, throwaway credential),
      # runs one correct- and one wrong-password +auth-only connection, and
      # asserts the accept/auth/disconnect JSON. No GUI or real account password.
      - name: Run audit-log integration test
        env:
          SDL_VIDEODRIVER: dummy
          MACRDP_TEST_BINARY: target/debug/macrdp
        run: ./scripts/test-audit-log.sh
